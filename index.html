    const SUPABASE_URL = "https://eydhzzvrofvkvzbmszxz.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGh6enZyb2Z2a3Z6Ym1zenh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTY3ODgsImV4cCI6MjEwNTYzMjc4OH0.o0mnxSkHyR4FlEKdOb8nyUdN96-6njcW9OIhVs65o2g";

    // Database completo delle domande per tutti gli 8 laboratori
    const quizData = {
        "meccanica": {

            options: [

                { text: "Analizzo il materiale del telaio per capire quali leghe leggere resistono di più.", type: "D" }
            ]
        },
        "misure": {
            title: "Misure Elettriche ed Elettroniche",
            question: "Un dispositivo elettrico smette improvvisamente di funzionare. Come intervieni?",
            options: [
                { text: "Ricerco il codice di errore o analizzo il flusso dei segnali logici.", type: "A" },
                { text: "Penso a come disporre meglio i componenti per renderlo più sicuro e compatto.", type: "B" },
                { text: "Prendo il tester per misurare la tensione e individuare subito il filo staccato.", type: "C" },
                { text: "Misuro come varia la resistenza al variare della temperatura del circuito.", type: "D" }
            ]
        },
        "fisica": {
            title: "Laboratorio di Fisica",
            question: "Vedi una montagna russa. Quale dettaglio cattura subito la tua attenzione?",
            options: [
                { text: "La traiettoria e le formule di gravità e accelerazione del giro della morte.", type: "A" },
                { text: "L'estetica, il design e la struttura delle curve e dei sostegni.", type: "B" },
                { text: "Il meccanismo di frenata magnetica o le catene che tirano su i carrelli.", type: "C" },
                { text: "Il modo in cui l'energia potenziale si trasforma in energia cinetica.", type: "D" }
            ]
        },
        "tpsee": {
            title: "Laboratorio TPSEE",
            question: "Immagina di dover realizzare uno 'Smart Home System' (casa intelligente). Di cosa vorresti occuparti?",
            options: [
                { text: "Scrivere le righe di codice che gestiscono l'automazione della centralina.", type: "A" },
                { text: "Progettare la mappa digitale dell'impianto e l'interfaccia di controllo utente.", type: "B" },
                { text: "Collegare i sensori, i relè e i cavi sulla scheda elettronica reale.", type: "C" },
                { text: "Testare il consumo energetico complessivo dell'impianto per ridurre gli sprechi.", type: "D" }
            ]
        },
        "cad": {
            title: "Laboratorio CAD",
            question: "Ti chiedono di ideare un nuovo modello di smartwatch. Su cosa ti concentri?",
            options: [

        "informatica": {

            question: "Vuoi creare un nuovo videogioco. Quale ruolo preferiresti avere nel team?",
            options: [

                { text: "Designer 3D/UI: curare le ambientazioni, l'interfaccia e la grafica.", type: "B" },
                { text: "Hardware Specialist: assemblare e ottimizzare il PC da gaming per farlo girare al massimo.", type: "C" },
                { text: "Game Analyst: analizzare le statistiche dei giocatori per bilanciare il gioco.", type: "D" }
            ]
        },
        "biologia": {
            title: "Laboratorio di Biologia",
            question: "Osservando una pianta che cresce al buio, cosa ti incuriosisce di più?",
            options: [
                { text: "Creare un modello matematico che preveda la velocità di crescita in base alla luce.", type: "A" },
                { text: "Progettare una serra verticale che ottimizzi lo spazio e la luce artificiale.", type: "B" },
                { text: "Costruire un sistema meccanico di irrigazione automatica a goccia.", type: "C" },
                { text: "Analizzare al microscopio cosa succede alle cellule senza la fotosintesi.", type: "D" }
            ]
        },
        "chimica": {
            title: "Laboratorio di Chimica",
            question: "Durante un esperimento vedi una soluzione che cambia colore e produce gas. Cosa pensi?",
            options: [
                { text: "Voglio calcolare le proporzioni esatte delle sostanze e la velocità di reazione.", type: "A" },
                { text: "Immagino come usare questa reazione per produrre un nuovo materiale utile.", type: "B" },
                { text: "Voglio toccare con mano le provette, preparare i dosaggi e usare le attrezzature.", type: "C" },
                { text: "Voglio capire la composizione molecolare dei reagenti e il perché del fenomeno.", type: "D" }
            ]
        }
    };

    let studentData = JSON.parse(localStorage.getItem('student_conti')) || null;
    const urlParams = new URLSearchParams(window.location.search);
    const currentLab = urlParams.get('lab');

    function init() {
        if (!studentData) {
            showStep('step-register');
        } else {
            document.getElementById('user-info').innerHTML = `<b>${studentData.name}</b><br><span class="font-mono text-[10px] text-blue-300">ID: ${studentData.id}</span>`;
            if (currentLab && quizData[currentLab]) {
                loadQuiz(currentLab);
            } else {
                showStatus();
            }
        }
    }

    async function registerStudent() {
        const name = document.getElementById('student-name').value.trim();
        if (!name) return alert("Per favore, inserisci il tuo nome e cognome.");
        
        studentData = {
            id: 'CONTI-' + Math.floor(1000 + Math.random() * 9000),
            name: name,
            answers: {},
            scores: { A: 0, B: 0, C: 0, D: 0 }
        };

        localStorage.setItem('student_conti', JSON.stringify(studentData));

        // Salva su Supabase
        await supabase.from('studenti').insert([{
            student_id: studentData.id,
            name: studentData.name,
            answers: studentData.answers,
            scores: studentData.scores
        }]);

        init();
    }

    function loadQuiz(labKey) {
        const quiz = quizData[labKey];
        document.getElementById('lab-title').innerText = quiz.title;
        document.getElementById('quiz-question').innerText = quiz.question;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        const currentAnswer = studentData.answers[labKey];

        quiz.options.forEach(opt => {
            const btn = document.createElement('button');
            let baseStyle = "w-full text-left p-4 border-2 rounded-xl transition font-medium text-sm leading-snug ";
            
            if (currentAnswer === opt.type) {
                baseStyle += "border-blue-600 bg-blue-50 text-blue-900 font-bold shadow-sm";
            } else {
                baseStyle += "border-slate-200 hover:border-blue-400 hover:bg-slate-50 text-slate-700";
            }

            btn.className = baseStyle;
            btn.innerText = opt.text;
            btn.onclick = () => saveAnswer(labKey, opt.type);
            container.appendChild(btn);
        });

        showStep('step-quiz');
    }

    async function saveAnswer(labKey, profileType) {
        if (studentData.answers[labKey]) {
            const oldType = studentData.answers[labKey];
            studentData.scores[oldType] = Math.max(0, studentData.scores[oldType] - 1);
        }

        studentData.answers[labKey] = profileType;
        studentData.scores[profileType] = (studentData.scores[profileType] || 0) + 1;
        
        localStorage.setItem('student_conti', JSON.stringify(studentData));

        // Aggiorna su Supabase
        await supabase.from('studenti').update({
            answers: studentData.answers,
            scores: studentData.scores
        }).eq('student_id', studentData.id);

        showStatus();
    }

    function showStatus() {
        showStep('step-status');
        const totalLabs = Object.keys(quizData).length;
        const answered = Object.keys(studentData.answers).length;
        const perc = Math.round((answered / totalLabs) * 100);
        
        document.getElementById('progress-fill').style.width = perc + '%';
        document.getElementById('progress-text').innerText = `${answered} su ${totalLabs}`;

        if (answered >= totalLabs) {
            document.getElementById('completed-notice').classList.remove('hidden');
        }
    }

    function showStep(stepId) {
        ['step-register', 'step-quiz', 'step-status'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(stepId).classList.remove('hidden');
    }

    window.onload = init;
</script>
