<!-- Aggiungi questo script nell'head di admin.html -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. INSERISCI QUI LE TUE CHIAVI SUPABASE
    const SUPABASE_URL = "https://eydhzzvrofvkvzbmszxz.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGh6enZyb2Z2a3Z6Ym1zenh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTY3ODgsImV4cCI6MjEwNTYzMjc4OH0.o0mnxSkHyR4FlEKdOb8nyUdN96-6njcW9OIhVs65o2g";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let chartInstance = null;
    let allStudents = [];

    // Carica tutti gli studenti e attiva la sincronizzazione in tempo reale
    async function loadFromStorage() {
        // Caricamento iniziale
        const { data, error } = await supabase.from('studenti').select('*');
        if (data) {
            allStudents = data.map(s => ({
                id: s.student_id,
                name: s.name,
                answers: s.answers,
                scores: s.scores
            }));
            renderStudentList(allStudents);
        }

        // Ascolto in REALTIME: ogni volta che un ragazzo risponde, la dashboard si aggiorna da sola
        supabase
            .channel('db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'studenti' }, async payload => {
                const { data } = await supabase.from('studenti').select('*');
                if (data) {
                    allStudents = data.map(s => ({
                        id: s.student_id,
                        name: s.name,
                        answers: s.answers,
                        scores: s.scores
                    }));
                    renderStudentList(allStudents);
                }
            })
            .subscribe();
    }

    function renderStudentList(students) {
        const listEl = document.getElementById('student-list');
        document.getElementById('student-count').innerText = students.length;

        if (students.length === 0) {
            listEl.innerHTML = `<p class="text-slate-500 text-sm text-center py-8">In attesa che gli studenti scansionino il primo QR Code...</p>`;
            return;
        }

        listEl.innerHTML = '';
        students.forEach((stu, index) => {
            const labCount = Object.keys(stu.answers || {}).length;
            const item = document.createElement('div');
            item.className = "p-4 bg-slate-700/50 hover:bg-slate-700 border border-slate-600 rounded-xl cursor-pointer transition flex justify-between items-center";
            item.onclick = () => selectStudent(index);
            item.innerHTML = `
                <div>
                    <div class="font-bold text-white text-sm">${stu.name}</div>
                    <div class="text-xs text-slate-400 font-mono">${stu.id}</div>
                </div>
                <span class="text-xs font-bold px-2 py-1 bg-slate-800 text-blue-400 rounded-md border border-slate-600">${labCount}/8 Lab</span>
            `;
            listEl.appendChild(item);
        });
    }

    function selectStudent(index) {
        const stu = allStudents[index];
        document.getElementById('no-selection').classList.add('hidden');
        document.getElementById('detail-panel').classList.remove('hidden');

        document.getElementById('detail-name').innerText = stu.name;
        document.getElementById('detail-id').innerText = `ID: ${stu.id}`;
        const labCount = Object.keys(stu.answers || {}).length;
        document.getElementById('detail-progress').innerText = `Laboratori completati: ${labCount}/8`;

        const scores = stu.scores || { A:0, B:0, C:0, D:0 };
        calculateOrientation(scores);
        renderChart(scores);
    }

    function calculateOrientation(scores) {
        const A = scores.A || 0; // Analitico / Informatica
        const B = scores.B || 0; // Progettista / CAD
        const C = scores.C || 0; // Maker / Meccanica / Elettronica
        const D = scores.D || 0; // Ricerca / Scienze

        let path = "";
        let desc = "";

        if ((D + A) >= (C + B) && D >= 2) {
            path = "Liceo Scientifico Scienze Applicate";
            desc = "Lo studente dimostra una spiccata propensione per l'indagine scientifica, la sperimentazione e la logica teorica. È il profilo ideale per il Liceo Scienze Applicate.";
        } else if (C >= A && C >= D) {
            if (B >= A) {
                path = "Tecnico - Meccanica e Meccatronica";
                desc = "Orientamento spiccato verso la materia, i meccanismi e la modellazione 3D. Lo studente ama capire come funzionano le macchine e usare software CAD.";
            } else {
                path = "Tecnico - Elettronica ed Elettrotecnica";
                desc = "Forte predisposizione per l'hardware, i circuiti e l'automazione. Indicato per chi vuole lavorare a contatto con sensori, quadri elettrici e schede elettroniche.";
            }
        } else {
            path = "Tecnico - Trasporti e Logistica / TPSEE";
            desc = "Profilo bilanciato con buone capacità di analisi e organizzazione. Adatto alla gestione dei flussi, alla programmazione di sistemi complessi e alla logistica.";
        }

        document.getElementById('recommended-path').innerText = path;
        document.getElementById('path-description').innerText = desc;
    }

    function renderChart(scores) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Software/Dati (A)', 'Progettazione/CAD (B)', 'Maker/Hardware (C)', 'Ricerca/Scienze (D)'],
                datasets: [{
                    label: 'Punteggio Attitudine',
                    data: [scores.A || 0, scores.B || 0, scores.C || 0, scores.D || 0],
                    backgroundColor: 'rgba(59, 130, 246, 0.25)',
                    borderColor: 'rgba(59, 130, 246, 1)',
                    pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255,255,255,0.1)' },
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        pointLabels: { color: '#94a3b8', font: { size: 11 } },
                        ticks: { display: false },
                        suggestedMin: 0,
                        suggestedMax: 5
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function filterStudents() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = allStudents.filter(s => s.name.toLowerCase().includes(query) || s.id.toLowerCase().includes(query));
        renderStudentList(filtered);
    }

    window.onload = loadFromStorage;
</script>
